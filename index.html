<!doctype html>
<html lang="tr">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sayi Tahmin Oyunu</title>
    <link rel="stylesheet" href="style.css" />
</head>

<body>
    <div class="container">
        <h1>Gizli Sayı</h1>
        <p>1 ile 100 arasında bir sayı tahmin yap, skorunu koru!</p>
        <div class="secret-number" id="secretNumber">?</div>
        <div class="scores">
            <div class="score">
                <p>Puan</p>
                <p id="score">100</p>
            </div>
            <div class="score">
                <p>En Yüksek Skor</p>
                <p id="highScore">100</p>
            </div>
        </div>
        <div class="message" id="message">Yeni Oyun! 1-100 arasında bir sayı tahmin et</div>
        <div class="input-area">
            <input type="number" id="guessInput" placeholder="Tahmininizi girin" />
            <button id="guessButton">Kontrol Et</button>
        </div>
        <p>Her yanlış tahmin puanını düşürür. Rekor kırmak için dikkatli ol!</p>


    </div>
    <script src="script.js"></script>
</body>

</html>
